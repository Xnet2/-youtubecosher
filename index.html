<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTube</title>
<link rel="icon" type="image/png" href="https://res.cloudinary.com/xgh73omp/image/upload/v1789899855/g1iwo09mhtzmmntgey9e.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;800&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body.light {
  --bg:#ffffff; --bg2:#f6f7f9; --bg3:#eceff4; --bg4:#dbe0e8;
  --txt:#14161b; --txt2:#4c5464; --txt3:#868d9b;
  --skel1:#eceff4; --skel2:#dbe0e8;
  --border:#e5e8ee; --shadow:rgba(16,24,40,.12);
  --surface:#ffffff; --raised:0 1px 2px rgba(16,24,40,.07);
  --spot:linear-gradient(205deg,#fbfcfe 0%,#eff3f8 100%);
  --topbar:rgba(255,255,255,.86);
  --tint:rgba(255,0,0,.07);
}
body.dark {
  --bg:#0f0f0f; --bg2:#1a1a1a; --bg3:#262628; --bg4:#3c3c40;
  --txt:#f2f2f3; --txt2:#a9adb5; --txt3:#76797f;
  --skel1:#262628; --skel2:#3c3c40;
  --border:rgba(255,255,255,0.09); --shadow:rgba(0,0,0,0.55);
  --surface:#181819; --raised:0 1px 2px rgba(0,0,0,.45);
  --spot:linear-gradient(205deg,#1e1e21 0%,#141416 100%);
  --topbar:rgba(15,15,15,.86);
  --tint:rgba(255,0,0,.16);
}
:root{--red:#ff0000;--red2:#cc0000;--blue:#3ea6ff;--sw:240px;--sc:72px;--th:56px;--ease:0.2s cubic-bezier(0.4,0,0.2,1);--font:'Rubik',system-ui,sans-serif;--font-display:'Frank Ruhl Libre','Rubik',Georgia,serif;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--txt);font-family:'Rubik',sans-serif;overflow-x:hidden;min-height:100vh;transition:background .2s,color .2s;}

/* TOPBAR */
#topbar{position:fixed;top:0;left:0;right:0;height:var(--th);background:var(--topbar);display:flex;align-items:center;padding:0 16px;gap:10px;z-index:200;border-bottom:1px solid var(--border);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);}
.tbtn{background:none;border:none;cursor:pointer;color:var(--txt);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background var(--ease);}
.tbtn:hover{background:var(--bg3);}
.tbtn svg{width:22px;height:22px;fill:currentColor;}
#logo{display:flex;align-items:center;text-decoration:none;flex-shrink:0;cursor:pointer;}
.logo-img{height:26px;width:auto;display:block;user-select:none;-webkit-user-drag:none;}
body.dark .logo-img{filter:invert(1) hue-rotate(180deg) saturate(6);}
@media(max-width:600px){.logo-img{height:22px;}}
.tb-r{display:flex;align-items:center;gap:8px;margin-inline-start:auto;flex-shrink:0;}

/* SEARCH BAR */
.search-wrap{display:flex;align-items:center;gap:10px;flex:1;max-width:600px;margin:0 24px;min-width:0;}
.search-box{display:flex;align-items:center;flex:1;height:40px;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--bg2);min-width:0;transition:border-color var(--ease),background var(--ease),box-shadow var(--ease);}
.search-box:focus-within{background:var(--bg);border-color:var(--bg4);box-shadow:0 0 0 4px var(--tint);}
.search-input{flex:1;min-width:0;height:100%;background:transparent;color:var(--txt);border:none;padding:0 16px;font-size:14px;font-family:'Rubik',sans-serif;outline:none;}
.search-input::placeholder{color:var(--txt3);}
.search-go{width:52px;height:100%;flex-shrink:0;background:var(--bg3);border:none;border-inline-start:1px solid var(--bg4);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--txt2);transition:background var(--ease);}
.search-go:hover{background:var(--bg4);}
.search-go svg{width:18px;height:18px;fill:currentColor;}
.mic-btn{width:38px;height:38px;border-radius:50%;background:var(--bg3);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--txt2);flex-shrink:0;transition:background var(--ease),color var(--ease);}
.mic-btn:hover{background:var(--bg4);}
.mic-btn svg{width:17px;height:17px;fill:currentColor;}
.mic-btn.listening{background:var(--red);color:#fff;animation:micpulse 1.2s infinite;}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,0,0,.4)}50%{box-shadow:0 0 0 6px rgba(255,0,0,0)}}
@media(max-width:900px){.search-wrap{display:none;}}

/* SIGN IN / USER CHIP */
.yt-login-btn{background:var(--red);color:#fff;border:none;border-radius:20px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Rubik',sans-serif;display:flex;align-items:center;gap:7px;transition:background var(--ease);flex-shrink:0;}
.yt-login-btn:hover{background:var(--red2);}
.yt-login-btn svg{width:16px;height:16px;}
.yt-user-chip{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--bg4);border-radius:20px;padding:3px 12px 3px 3px;cursor:pointer;transition:background var(--ease);}
.yt-user-chip:hover{background:var(--bg4);}
.yt-user-av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--bg4);}
.yt-user-name{font-size:12px;font-weight:500;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* USER MENU */
#user-menu{position:fixed;top:calc(var(--th) + 8px);left:12px;width:230px;background:var(--bg2);border:1px solid var(--bg4);border-radius:12px;box-shadow:0 8px 32px var(--shadow);z-index:300;padding:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(-8px);}
#user-menu.open{opacity:1;pointer-events:all;transform:translateY(0);}
.um-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;transition:background var(--ease);}
.um-item:hover{background:var(--bg3);}
.um-item svg{width:17px;height:17px;fill:currentColor;flex-shrink:0;}

/* BELL / NOTIFICATIONS */
.bell-wrap{position:relative;}
.notif-badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--red);font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;color:#fff;pointer-events:none;border:2px solid var(--bg);padding:0 3px;}
.notif-badge.show{display:flex;}
#notif-panel{position:fixed;top:calc(var(--th) + 8px);left:60px;width:340px;max-height:70vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--bg4);border-radius:12px;box-shadow:0 8px 32px var(--shadow);z-index:300;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(-8px);}
#notif-panel.open{opacity:1;pointer-events:all;transform:translateY(0);}
.np-hdr{padding:12px 16px;font-size:14px;font-weight:700;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.np-hdr-btn{background:var(--bg3);border:1px solid var(--bg4);color:var(--txt2);border-radius:14px;padding:5px 10px;font-size:11px;font-weight:500;cursor:pointer;font-family:'Rubik',sans-serif;white-space:nowrap;transition:background var(--ease);}
.np-hdr-btn:hover{background:var(--bg4);color:var(--txt);}
.np-item{display:flex;gap:10px;padding:10px 14px;cursor:pointer;transition:background var(--ease);border-bottom:1px solid var(--border);}
.np-item:hover{background:var(--bg3);}
.np-thumb{width:100px;aspect-ratio:16/9;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--bg3);}
.np-title{font-size:12.5px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.np-ch{font-size:11px;color:var(--txt3);margin-top:4px;}
.np-empty{padding:28px 16px;text-align:center;font-size:12.5px;color:var(--txt3);}

/* SIDEBAR */
#sidebar{position:fixed;top:var(--th);right:0;width:var(--sw);height:calc(100vh - var(--th));background:var(--bg);overflow-y:auto;overflow-x:hidden;padding:10px 0 24px;z-index:100;transition:width var(--ease);scrollbar-width:thin;scrollbar-color:var(--bg4) transparent;}
#sidebar.col{width:var(--sc);}
#sidebar::-webkit-scrollbar{width:4px;}
#sidebar::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px;}

.nitem{display:flex;align-items:center;gap:14px;height:40px;padding:0 20px;cursor:pointer;color:var(--txt2);transition:background var(--ease),color var(--ease);white-space:nowrap;overflow:hidden;border-radius:20px;margin:2px 10px;}
.nitem:hover{background:var(--bg3);color:var(--txt);}
.nitem.on{background:var(--tint);color:var(--txt);font-weight:600;}
.nitem.on .ni{color:var(--red);}
.ni{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ni svg{width:20px;height:20px;fill:currentColor;}
.nl{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;}
.sb-div{height:1px;background:var(--border);margin:10px 12px;}
#sidebar.col .nitem{justify-content:center;padding:0;margin-inline-end:0;border-radius:50%;width:44px;height:44px;margin-inline-start:14px;}
#sidebar.col .nl{display:none;}

.sb-label{font-size:11px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.8px;padding:8px 20px 6px;white-space:nowrap;overflow:hidden;transition:opacity var(--ease),height var(--ease),padding var(--ease);height:26px;}
#sidebar.col .sb-label{opacity:0;height:0;padding:0;}
.chitem{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px 0 8px;cursor:pointer;border-radius:10px;margin:2px 8px;transition:background var(--ease);color:var(--txt);white-space:nowrap;overflow:hidden;}
.chitem:hover{background:var(--bg3);}
.chitem.active{background:var(--bg3);}
.chdot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;position:relative;overflow:hidden;background:var(--bg4);}
.chdot .ndot{position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--bg);display:none;z-index:2;}
.chdot.hn .ndot{display:block;}
.chdot img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.chname{font-size:13px;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
#sidebar.col .chitem{padding:0;justify-content:center;gap:0;}
#sidebar.col .chname{display:none;}
.sb-empty{padding:10px 20px;font-size:12px;color:var(--txt3);line-height:1.6;}

/* MAIN */
#main{margin-top:var(--th);margin-right:var(--sw);padding:26px 30px 64px;transition:margin-right var(--ease);min-height:calc(100vh - var(--th));}
#content{max-width:1520px;margin:0 auto;}
#main.col{margin-right:var(--sc);}

/* FILTER CHIPS / TOOLBAR */
.filter-chips{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.fchip{background:var(--bg3);border:1px solid var(--bg4);color:var(--txt2);border-radius:20px;padding:7px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Rubik',sans-serif;transition:all var(--ease);white-space:nowrap;display:flex;align-items:center;gap:6px;}
.fchip:hover{border-color:var(--red);color:var(--red);}
.fchip.on{background:var(--red);border-color:var(--red);color:#fff;}
.fchip svg{width:14px;height:14px;fill:currentColor;}
.toolbar-spacer{flex:1;}
.refresh-btn{background:var(--bg2);border:1px solid var(--border);color:var(--txt2);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:7px;transition:background var(--ease),color var(--ease),border-color var(--ease);}
.refresh-btn:hover{background:var(--bg3);color:var(--txt);border-color:var(--bg4);}
.refresh-btn svg{width:15px;height:15px;fill:currentColor;}
.refresh-btn.spin svg{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.section-title{font-family:var(--font-display);font-size:21px;font-weight:700;margin-bottom:14px;}

/* ============ HOME PAGE ============ */
.home-top{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:0 0 26px;}
.home-greet{font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1.15;color:var(--txt);}
.home-sub{margin-top:7px;font-size:13.5px;color:var(--txt2);}
.home-sub strong{font-weight:600;color:var(--txt);}
.home-top .refresh-btn{margin-inline-start:auto;margin-bottom:3px;}

/* ---- spotlight ---- */
.spot{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);background:var(--spot);border:1px solid var(--border);border-radius:22px;overflow:hidden;margin-bottom:30px;}
.spot-media{position:relative;aspect-ratio:16/9;background:var(--bg3);cursor:pointer;overflow:hidden;}
.spot-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.7,.3,1);}
.spot:hover .spot-media img{transform:scale(1.04);}
.spot-body{padding:28px 30px;display:flex;flex-direction:column;justify-content:center;gap:14px;min-width:0;}
.spot-tag{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--red);}
.spot-tag i{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px var(--tint);}
.spot-title{font-family:var(--font-display);font-size:27px;font-weight:700;line-height:1.3;color:var(--txt);cursor:pointer;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.spot-ch{display:flex;align-items:center;gap:11px;min-width:0;}
.spot-ch .vav{width:38px;height:38px;}
.spot-ch-n{font-size:14px;font-weight:600;color:var(--txt);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.spot-ch-n:hover{text-decoration:underline;}
.spot-ch-t{font-size:12.5px;color:var(--txt3);margin-top:2px;}
.spot-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.sbtn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--txt);cursor:pointer;transition:background var(--ease),border-color var(--ease),transform .15s;}
.sbtn svg{width:16px;height:16px;fill:currentColor;}
.sbtn:hover{background:var(--bg3);border-color:var(--bg4);}
.sbtn:active{transform:scale(.98);}
.sbtn-main{background:var(--red);border-color:var(--red);color:#fff;}
.sbtn-main:hover{background:var(--red2);border-color:var(--red2);}

/* ---- channel chips ---- */
.chip-row{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:30px;scrollbar-width:none;-ms-overflow-style:none;}
.chip-row::-webkit-scrollbar{display:none;}
.cchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding-block:5px;padding-inline-start:6px;padding-inline-end:14px;cursor:pointer;font-family:var(--font);transition:background var(--ease),border-color var(--ease);max-width:220px;}
.cchip:hover{background:var(--bg3);border-color:var(--bg4);}
.cchip .cc-av{width:28px;height:28px;border-radius:50%;background:var(--bg3);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--txt2);flex-shrink:0;position:relative;}
.cchip .cc-av img{width:100%;height:100%;object-fit:cover;}
.cchip .cc-n{font-size:13px;font-weight:500;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cchip .cc-new{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0;}
.cchip.all{padding-inline-start:16px;padding-block:9px;}
.skel-spot{pointer-events:none;}
.skel-spot .spot-body{gap:12px;}
.cchip.all .cc-n{color:var(--txt2);}

/* ---- section heads + shelves ---- */
.home-section{margin-bottom:40px;}
.home-section:last-child{margin-bottom:0;}
.home-head{display:flex;align-items:baseline;gap:11px;margin-bottom:15px;}
.home-section-title{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.2;color:var(--txt);}
.home-count{font-size:12.5px;color:var(--txt3);}
.home-head-nav{margin-inline-start:auto;display:flex;gap:7px;align-self:center;}
.shelf-nav{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--txt2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background var(--ease),color var(--ease),border-color var(--ease);}
.shelf-nav:hover{background:var(--bg3);color:var(--txt);border-color:var(--bg4);}
.shelf-nav svg{width:18px;height:18px;fill:currentColor;}
.vgrid.shelf-scroll{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:18px;padding-bottom:2px;min-width:0;scroll-snap-type:x proximity;scrollbar-width:none;-ms-overflow-style:none;}
.vgrid.shelf-scroll::-webkit-scrollbar{display:none;}
.vgrid.shelf-scroll .vcard{flex:0 0 266px;scroll-snap-align:start;}
.vgrid.shelf-scroll.shorts-grid .vcard{flex:0 0 172px;}

/* ---- a11y ---- */
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px;}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

/* CHANNEL PAGE HEADER */
.channel-header{display:flex;align-items:center;gap:16px;margin-bottom:24px;}
.channel-header .ch-av{width:56px;height:56px;border-radius:50%;flex-shrink:0;overflow:hidden;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;}
.channel-header .ch-av img{width:100%;height:100%;object-fit:cover;}
.channel-header .ch-name{font-size:20px;font-weight:800;}
.channel-header .ch-sub{font-size:12.5px;color:var(--txt3);margin-top:3px;}

/* EMPTY / SIGN-IN STATE */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 20px;color:var(--txt2);}
.eico{width:64px;height:64px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
.eico svg{width:30px;height:30px;fill:var(--txt3);}
.empty h3{font-size:17px;font-weight:700;margin-bottom:8px;color:var(--txt);}
.empty p{font-size:13px;color:var(--txt3);max-width:340px;line-height:1.6;margin-bottom:18px;}
.empty code{background:var(--bg3);padding:2px 6px;border-radius:4px;font-size:11.5px;direction:ltr;display:inline-block;}

/* VIDEO GRID */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:26px 18px;}
.vcard{cursor:pointer;position:relative;}
.vthumb-wrap{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:var(--bg3);margin-bottom:11px;box-shadow:var(--raised);}
.vthumb-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s;}
.vcard:hover .vthumb-wrap img{transform:scale(1.05);}
.vdur{position:absolute;bottom:7px;left:7px;background:rgba(0,0,0,.72);color:#fff;font-size:11.5px;font-weight:600;padding:3px 7px;border-radius:7px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.short-flag{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;}
.short-flag svg{width:13px;height:13px;fill:#fff;}
.nf-dot{position:absolute;top:8px;right:8px;width:12px;height:12px;border-radius:50%;background:#22c55e;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 1px 4px rgba(0,0,0,.4);z-index:2;}
.short-flag ~ .nf-dot{right:38px;}
.new-flag{position:absolute;top:8px;left:8px;background:var(--blue);color:#06121f;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.2px;}
.wl-btn{position:absolute;bottom:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .15s;z-index:2;}
.wl-btn svg{width:14px;height:14px;fill:#fff;}
.wl-btn:hover{transform:scale(1.12);}
.wl-btn.on{background:var(--red);}
.like-btn{position:absolute;bottom:6px;right:38px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .15s;z-index:2;}
.like-btn svg{width:14px;height:14px;fill:#fff;}
.like-btn:hover{transform:scale(1.12);}
.like-btn.on svg{fill:var(--red);}
.vinfo{display:flex;gap:10px;}
.vav{width:34px;height:34px;border-radius:50%;flex-shrink:0;overflow:hidden;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;}
.vav img{width:100%;height:100%;object-fit:cover;}
.vtext{min-width:0;flex:1;}
.vtitle{font-size:14px;font-weight:600;line-height:1.4;color:var(--txt);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px;}
.vch{font-size:12.5px;color:var(--txt2);cursor:pointer;}
.vch:hover{color:var(--txt);text-decoration:underline;}
.vmeta{font-size:11.5px;color:var(--txt3);}

/* SHORTS GRID variant */
.vgrid.shorts-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));}
.vgrid.shorts-grid .vthumb-wrap{aspect-ratio:9/16;}

/* ENLARGED GRID (home page, when inline playback mode is on) */
.vgrid.vgrid-large{grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:28px 22px;}
.vgrid.vgrid-large .vtitle{font-size:15.5px;}
.vgrid.vgrid-large .vch,.vgrid.vgrid-large .vmeta{font-size:12.5px;}
.vgrid.vgrid-large .vav{width:40px;height:40px;}

/* PLAYER MODAL */
#player-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
#player-modal.open{display:flex;}
.pm-box{width:100%;max-width:900px;}
.pm-frame-wrap{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;}
.pm-frame-wrap.short-mode{aspect-ratio:9/16;max-width:400px;margin:0 auto;}
.pm-frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
.pm-close{position:absolute;top:-44px;left:0;background:none;border:none;color:#fff;cursor:pointer;padding:6px;}
.pm-close svg{width:26px;height:26px;fill:currentColor;}
.pm-title{color:#fff;font-size:15px;font-weight:600;margin-top:14px;line-height:1.4;}
.pm-ch{color:rgba(255,255,255,.65);font-size:12.5px;margin-top:6px;}

/* SETTINGS PAGE */
.sp{max-width:980px;margin:0 auto;}
.sp-head{margin-bottom:22px;}
.sp-head h1{font-size:24px;font-weight:800;letter-spacing:-.3px;line-height:1.2;}
.sp-head p{font-size:13px;color:var(--txt3);margin-top:6px;line-height:1.6;}
.sp-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;align-items:start;}
.sp-nav{position:sticky;top:calc(var(--th) + 18px);display:flex;flex-direction:column;gap:4px;}
.sp-tab{display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border-radius:12px;border:none;background:none;color:var(--txt2);font-family:'Rubik',sans-serif;font-size:14px;font-weight:500;cursor:pointer;text-align:start;transition:background var(--ease),color var(--ease);}
.sp-tab:hover{background:var(--bg3);color:var(--txt);}
.sp-tab.on{background:var(--bg3);color:var(--txt);font-weight:600;}
.sp-tab.on svg{color:var(--red);}
.sp-tab svg{width:20px;height:20px;fill:currentColor;flex-shrink:0;}
.sp-panels{min-width:0;}
.sp-panel{display:none;flex-direction:column;gap:18px;}
.sp-panel.on{display:flex;}
.sp-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
.sp-card-h{padding:16px 20px 6px;font-size:12px;font-weight:600;color:var(--txt3);letter-spacing:.6px;}
.sp-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 20px;border-top:1px solid var(--border);}
.sp-row:first-child,.sp-card-h + .sp-row{border-top:none;}
.sp-row.sub{padding-inline-start:44px;}
.sp-txt{min-width:0;flex:1;}
.sp-lbl{font-size:14.5px;font-weight:500;}
.sp-desc{font-size:12.5px;color:var(--txt3);line-height:1.65;margin-top:3px;}
.sp-count{font-size:12px;color:var(--txt2);font-weight:500;}
.sw{position:relative;width:46px;height:26px;border-radius:13px;border:none;background:var(--txt3);cursor:pointer;flex-shrink:0;padding:0;transition:background var(--ease);}
.sw::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:inset-inline-start var(--ease);}
.sw[aria-checked="true"]{background:var(--red);}
.sw[aria-checked="true"]::after{inset-inline-start:23px;}
.sw:disabled{opacity:.4;cursor:not-allowed;}
.seg{display:inline-flex;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px;flex-shrink:0;}
.seg button{border:none;background:none;color:var(--txt2);font-family:'Rubik',sans-serif;font-size:13px;font-weight:500;padding:7px 20px;border-radius:9px;cursor:pointer;transition:background var(--ease),color var(--ease);}
.seg button.on{background:var(--bg);color:var(--txt);font-weight:600;box-shadow:0 1px 4px var(--shadow);}
.sp-btn{background:var(--bg3);border:1px solid var(--bg4);color:var(--txt);border-radius:18px;padding:8px 16px;font-size:13px;font-weight:500;font-family:'Rubik',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex-shrink:0;transition:background var(--ease),border-color var(--ease),color var(--ease);}
.sp-btn:hover{background:var(--bg4);}
.sp-btn svg{width:15px;height:15px;fill:currentColor;}
.sp-btn.danger{color:#ff6b6b;}
.sp-btn.armed{background:#e5484d;border-color:#e5484d;color:#fff;}
.sp-btn:disabled{opacity:.4;cursor:default;pointer-events:none;}
.sp-btn.spin svg{animation:spin 1s linear infinite;}
.sp-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:16px;font-size:12.5px;font-weight:600;background:var(--bg3);color:var(--txt2);white-space:nowrap;flex-shrink:0;}
.sp-pill i{width:8px;height:8px;border-radius:50%;background:var(--txt3);}
.sp-pill.ok i{background:#22c55e;}
.sp-pill.bad i{background:#f59e0b;}
.sp-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--border);}
.sp-card-h + .sp-stats{border-top:none;}
.sp-stat{padding:16px 20px;border-inline-start:1px solid var(--border);}
.sp-stat:first-child{border-inline-start:none;}
.sp-stat b{display:block;font-size:24px;font-weight:700;line-height:1.1;}
.sp-stat span{display:block;font-size:12px;color:var(--txt3);margin-top:5px;}
.sp-stat.open b{color:#22c55e;}
.sw:focus-visible,.sp-tab:focus-visible,.sp-btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
@media(max-width:760px){
  .sp-layout{grid-template-columns:minmax(0,1fr);gap:16px;}
  .sp-nav{top:var(--th);z-index:20;flex-direction:row;overflow-x:auto;background:var(--bg);margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--border);scrollbar-width:none;}
  .sp-nav::-webkit-scrollbar{display:none;}
  .sp-tab{flex-shrink:0;height:38px;border-radius:19px;padding:0 16px;}
  .sp-head h1{font-size:21px;}
  .sp-card-h{padding:14px 16px 4px;}
  .sp-row{padding:14px 16px;gap:12px;}
  .sp-row.sub{padding-inline-start:28px;}
  .sp-stat{padding:14px 16px;}
  .seg button{padding:7px 14px;}
}

/* CHANNELS PAGE */
.chp{max-width:1100px;margin:0 auto;}
.chp-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
.chp-head h1{font-size:24px;font-weight:800;letter-spacing:-.3px;line-height:1.2;}
.chp-sub{font-size:13px;color:var(--txt3);margin-top:6px;}
.chp-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.chp-search{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--bg4);border-radius:20px;background:var(--bg);min-width:230px;transition:border-color var(--ease);}
.chp-search:focus-within{border-color:var(--blue);}
.chp-search svg{width:18px;height:18px;fill:var(--txt3);flex-shrink:0;}
.chp-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--txt);font-family:'Rubik',sans-serif;font-size:14px;}
.chp-search input::placeholder{color:var(--txt3);}
.chp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.chp-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;cursor:pointer;transition:background var(--ease),border-color var(--ease);}
.chp-card:hover{background:var(--bg3);border-color:var(--bg4);}
.chp-av{position:relative;width:52px;height:52px;border-radius:50%;flex-shrink:0;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;}
.chp-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.chp-new{position:absolute;top:0;right:0;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--bg2);}
.chp-card:hover .chp-new{border-color:var(--bg3);}
.chp-info{min-width:0;flex:1;}
.chp-name{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chp-meta{font-size:12px;color:var(--txt3);margin-top:4px;}
.chp-empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--txt3);font-size:14px;}
@media(max-width:760px){
  .chp-head h1{font-size:21px;}
  .chp-tools{width:100%;}
  .chp-search{flex:1;min-width:0;}
  .chp-grid{grid-template-columns:minmax(0,1fr);}
}

/* NETFREE: הסתרת סרטונים חסומים */
.vcard.nf-hide{display:none;}
.nf-note{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:9px 14px;margin-bottom:18px;font-size:12.5px;color:var(--txt2);}
.nf-note-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0;}
.nf-note.busy .nf-note-dot{animation:nfpulse 1.1s ease-in-out infinite;}
@keyframes nfpulse{0%,100%{opacity:1}50%{opacity:.25}}
.nf-note a{margin-inline-start:auto;color:var(--blue);cursor:pointer;white-space:nowrap;}
.nf-note a:hover{text-decoration:underline;}

/* SKELETON */
.skel{background:linear-gradient(90deg,var(--skel1) 25%,var(--skel2) 37%,var(--skel1) 63%);background-size:400% 100%;animation:shimmer 1.4s infinite;border-radius:12px;}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.skel-card .vthumb-wrap{background:none;}
.skel-line{height:12px;border-radius:4px;margin-bottom:6px;}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg4);color:var(--txt);padding:10px 20px;border-radius:24px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:600;box-shadow:0 4px 20px var(--shadow);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:760px){
  :root{--sw:0px;}
  #sidebar{transform:translateX(100%);width:260px !important;box-shadow:-8px 0 24px var(--shadow);}
  #sidebar.mobopen{transform:translateX(0);}
  #main{margin-right:0 !important;padding:16px 16px 48px;}
  #notif-panel{left:8px;right:8px;width:auto;}
}

/* HOME — responsive */
@media(max-width:1100px){
  .spot{grid-template-columns:1fr;}
  .spot-body{padding:22px;gap:12px;}
  .spot-title{font-size:23px;-webkit-line-clamp:2;}
}
@media(max-width:760px){
  .home-top{margin-bottom:20px;gap:10px;}
  .home-greet{font-size:25px;}
  .home-sub{font-size:12.5px;}
  .home-top .refresh-btn{padding:8px 14px;font-size:12.5px;}
  .spot{border-radius:18px;margin-bottom:24px;}
  .spot-title{font-size:20px;}
  .spot-actions .sbtn{padding:10px 16px;font-size:13px;}
  .chip-row{margin-bottom:24px;}
  .home-section{margin-bottom:30px;}
  .home-section-title{font-size:19px;}
  .home-head-nav{display:none;}
  .vgrid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:20px 12px;}
  .vgrid.shelf-scroll .vcard{flex:0 0 212px;}
  .vgrid.shelf-scroll.shorts-grid .vcard{flex:0 0 142px;}
  .vtitle{font-size:13px;}
  .vav{width:30px;height:30px;}
}

  watchlater: 'הרשימה ריקה. אפשר להוסיף סרטון דרך כפתור הסימנייה שמופיע על כל כרטיס.',

};

/* ============ URL ROUTING ============ */
const SECTION_PATH = {
  all: 'דף-הבית',
  recommended: 'מומלצים',
  liked: 'אהבתי',
  following: 'עוקב-אחרי',
  watched: 'צפיתי',
  watchlater: 'לצפייה-מאוחרת',
  shorts: 'שורטס',
  personal: 'אזור-אישי',
  channels: 'ערוצים',
  settings: 'הגדרות'
};
const PATH_SECTION = Object.keys(SECTION_PATH).reduce(function (acc, k) {
  acc[SECTION_PATH[k]] = k;
  return acc;
}, {});
const CHANNEL_SEG = 'ערוץ';
let basePath = '';

function restoreRedirectFromNotFound() {
  const params = new URLSearchParams(location.search);
  const redirect = params.get('__redirect');
  if (redirect == null) return;
  const q = params.get('__q');
  const newPath = location.pathname.replace(/\/+$/, '') + redirect;
  const newUrl = newPath + (q ? ('?' + q) : '') + location.hash;
  history.replaceState(null, '', newUrl);
}

function computeBasePath() {
  const path = location.pathname.replace(/\/+$/, '');
  const segs = path.split('/');
  if (segs.length >= 2 && decodeURIComponent(segs[segs.length - 2] || '') === CHANNEL_SEG) {
    return segs.slice(0, segs.length - 2).join('/');
  }
  const last = decodeURIComponent(segs[segs.length - 1] || '');
  if (PATH_SECTION[last]) {
    return segs.slice(0, segs.length - 1).join('/');
  }
  return path;
}

function restoreStateFromUrl() {
  let rel = location.pathname.replace(/\/+$/, '');
  if (basePath && rel.indexOf(basePath) === 0) rel = rel.slice(basePath.length);
  rel = rel.replace(/^\/+/, '');
  const segs = rel.split('/').filter(Boolean).map(decodeURIComponent);
  if (segs.length === 2 && segs[0] === CHANNEL_SEG) {
    section = 'channel';
    activeChannelFilter = segs[1];
    return;
  }
  if (segs.length === 1 && PATH_SECTION[segs[0]]) {
    section = PATH_SECTION[segs[0]];
    activeChannelFilter = null;
    return;
  }
  section = 'all';
  activeChannelFilter = null;
}

function pathSegmentForState() {
  if (section === 'channel' && activeChannelFilter) {
    return CHANNEL_SEG + '/' + encodeURIComponent(activeChannelFilter);
  }
  return SECTION_PATH[section] || SECTION_PATH.all;
}

function updateUrl() {
  const seg = pathSegmentForState();
  const newPath = (basePath || '') + '/' + seg;
  if (location.pathname.replace(/\/+$/, '') !== newPath.replace(/\/+$/, '')) {
    history.pushState({ section: section, activeChannelFilter: activeChannelFilter }, '', newPath);
  }
}

function syncSidebarActiveClass() {
  document.querySelectorAll('.nitem').forEach(function (n) { n.classList.remove('on'); });
  const el = document.getElementById('n-' + section);
  if (el) el.classList.add('on');
}

/* ============ INIT ============ */
window.addEventListener('load', () => {
  restoreRedirectFromNotFound();
  basePath = computeBasePath();
  restoreStateFromUrl();

  document.body.className = localStorage.getItem(THEME_KEY) || 'light';
  if (localStorage.getItem(SIDEBAR_KEY) === '1') {
    document.getElementById('sidebar').classList.add('col');
    document.getElementById('main').classList.add('col');
  }
  try { seenMap = JSON.parse(localStorage.getItem(SEEN_KEY) || '{}'); } catch(e){ seenMap = {}; }
  loadCachedChannels();
  loadCachedVideos();
  loadCachedMe();
  loadLocalLists();
  { const n = Number(localStorage.getItem(SB_CH_KEY)); sidebarChannelCount = [5, 8, 12].includes(n) ? n : 8; }
  inlineMode = localStorage.getItem(INLINE_MODE_KEY) === '1';
  updateInlineToggleUI();
  netfreeMode = localStorage.getItem(NETFREE_MODE_KEY) === '1';
  hideBlockedMode = netfreeMode && localStorage.getItem(NF_HIDE_KEY) === '1';
  loadNfCache();
  updateNetfreeToggleUI();
  renderAuthArea();
  renderChannels();
  syncSidebarActiveClass();
  updateUrl();
  renderContent();
  updateNotifBadge();
  bindUI();
  initVoiceSearch();
  detectExtension().then((found) => {
    if (found) {
      extMode = true;
      updateNetfreeToggleUI();
      loadFromExtension(false);
    } else {
      netfreeMode = false;
      updateNetfreeToggleUI();
      if (hideBlockedMode) renderContent();
      initGoogleAuth();
      restoreSessionAndMaybeLoad();
    }
  });
});

window.addEventListener('popstate', () => {
  restoreStateFromUrl();

  activeInlineId = null;

});

let seenMap = {};

function loadLocalLists() {
  try { watchHistory = JSON.parse(localStorage.getItem(WATCH_HISTORY_KEY) || '[]'); } catch(e){ watchHistory = []; }
  try { watchLater = JSON.parse(localStorage.getItem(WATCH_LATER_KEY) || '[]'); } catch(e){ watchLater = []; }
  try { likedVideos = JSON.parse(localStorage.getItem(LIKED_KEY) || '[]'); } catch(e){ likedVideos = []; }
}

/* ============ EXTENSION BRIDGE (MyTube Bridge) ============ */
// אם התוסף MyTube Bridge מותקן, הוא מושך את המנויים והסרטונים ישירות מיוטיוב
// בדפדפן של המשתמש — בלי התחברות עם Google, בלי מכסת API ובלי שרת.
// אם הוא לא מותקן, האתר ממשיך לעבוד בדרך הקודמת (Google Sign-In + Worker).
const EXT_STALE_MS = 15 * 60 * 1000;
let extMode = false;
let extPresent = false;
let extVersion = '';
let dataUpdatedAt = 0;
let extSeq = 0;
const extPending = new Map();

window.addEventListener('message', (e) => {
  const d = e.data;
  if (e.source !== window || !d || d.source !== 'mytube-ext') return;
  if (d.type === 'READY') { extPresent = true; return; }
  const p = extPending.get(d.id);
  if (!p) return;
  extPending.delete(d.id);
  clearTimeout(p.timer);
  if (d.ok) p.resolve(d.data); else p.reject(new Error(d.error || 'EXT_ERROR'));
});

function extCall(type, timeoutMs, payload) {
  return new Promise((resolve, reject) => {
    const id = ++extSeq;
    const timer = setTimeout(() => { extPending.delete(id); reject(new Error('EXT_TIMEOUT')); }, timeoutMs || 180000);
    extPending.set(id, { resolve, reject, timer });
    window.postMessage(Object.assign({ source: 'mytube-page', id, type }, payload || {}), window.location.origin);
  });
}

async function detectExtension() {
  for (let i = 0; i < 3 && !extPresent; i++) {
    try {
      const r = await extCall('PING', 700);
      extPresent = true;
      if (r && r.version) extVersion = r.version;
    } catch (e) {}
  }
  if (extPresent && !extVersion) {
    try { const r = await extCall('PING', 1500); if (r && r.version) extVersion = r.version; } catch (e) {}
  }
  return extPresent;
}

function applyExtData(d) {
  channels = d.channels || [];
  allVideos = d.videos || [];
  dataUpdatedAt = d.updatedAt || Date.now();
  currentUser = { name: 'YouTube', picture: '', channelId: null };
  lastError = null;
  try {
    localStorage.setItem(CHANNELS_CACHE_KEY, JSON.stringify(channels));
    localStorage.setItem(VIDEOS_CACHE_KEY, JSON.stringify(allVideos.slice(0, 300)));
    localStorage.setItem(ME_CACHE_KEY, JSON.stringify(currentUser));
  } catch (e) {}
  renderAuthArea();
  renderChannels();
  renderContent();
  updateNotifBadge();
  renderNotifPanel();
}

async function loadFromExtension(forceToast) {
  if (loading) return;
  if (forceToast) { for (const id in nfStatus) if (nfStatus[id] !== 'open') delete nfStatus[id]; }
  loading = true;
  lastError = null;
  setRefreshSpin(true);
  try {
    let cached = null;
    try { cached = await extCall('GET_CACHED', 5000); } catch (e) {}
    if (cached && cached.videos && cached.videos.length) applyExtData(cached);

    const stale = !cached || !cached.updatedAt || (Date.now() - cached.updatedAt) > EXT_STALE_MS;
    if (stale || forceToast) {
      const fresh = await extCall('REFRESH');
      applyExtData(fresh);
      if (fresh.warning === 'RATE_LIMITED') toast('יוטיוב הגביל זמנית את הבקשות — חלק מהערוצים לא עודכנו');
      else if (forceToast) toast('הנתונים עודכנו');
    }
  } catch (e) {
    const msg = (e && e.message) || '';
    lastError = msg === 'NO_CHANNELS'
      ? 'לא נמצאו מנויים. ודא שאתה מחובר ליוטיוב באותו דפדפן (youtube.com/feed/channels).'
      : (msg || 'שגיאה בטעינת הנתונים');
    toast('שגיאה בטעינת הנתונים');
    renderContent();
  } finally {
    loading = false;
    setRefreshSpin(false);
  }
}

/* ============ THUMBNAILS ============ */
// מ-RSS מגיעה תמונה קטנה (320px), וזה מה שגרם לטשטוש. מבקשים תמונה גדולה
// יותר ישירות משרתי התמונות של יוטיוב, עם נסיגה אוטומטית כשאין כזו לסרטון
// (maxres לא קיימת בסרטונים ישנים או באיכות נמוכה).
// לחיסכון בתעבורה אפשר להוריד את 'maxresdefault' מתחילת הרשימה.
const THUMB_CHAIN = ['maxresdefault', 'sddefault', 'hqdefault', 'mqdefault'];
const THUMB_BASE = 'https://i.ytimg.com/vi/';
function thumbSrc(id, q) { return THUMB_BASE + encodeURIComponent(id) + '/' + THUMB_CHAIN[q] + '.jpg'; }
function thumbNext(img) {
  const q = (+img.dataset.q || 0) + 1;
  if (q < THUMB_CHAIN.length) { img.dataset.q = q; img.src = thumbSrc(img.dataset.vid, q); }
  else img.style.opacity = 0;
}
// כשחסרה תמונה, יוטיוב מחזיר תמונת מקום קטנה (120px) ולא שגיאה
function thumbLoaded(img) { if (img.naturalWidth > 0 && img.naturalWidth <= 120) thumbNext(img); }

/* ============ NETFREE MODE ============ */
// מסמן נקודה ירוקה על כל סרטון שפתוח בנטפרי. הבדיקה מתבצעת בתוסף
// (MyTube Bridge), רק לסרטונים שמוצגים כרגע, ותוצאות נשמרות ב-cache.
// אפשרות נוספת בהגדרות: הסתרת סרטונים שאינם פתוחים (hideBlockedMode).
const NETFREE_MODE_KEY = 'mytube_netfree_mode';
const NF_HIDE_KEY = 'mytube_netfree_hide';
const NF_CACHE_KEY = 'mytube_netfree_cache';
const NF_BATCH = 12;
const NF_PREFETCH = 150;               // כשההסתרה פעילה בודקים מראש עד כמה סרטונים, כדי שהדף יתמלא בסרטונים פתוחים
const NF_OPEN_TTL = 6 * 3600 * 1000;   // אותם זמנים כמו ב-cache של התוסף
const NF_BLOCKED_TTL = 15 * 60 * 1000;
const NF_DOT_HTML = '<span class="nf-dot" title="פתוח בנטפרי"></span>';
let netfreeMode = false;
let hideBlockedMode = false;   // הסתרת סרטונים חסומים (פעיל רק כשמצב נטפרי פעיל)
const nfStatus = {};          // videoId -> 'open' | 'blocked'
const nfTime = {};            // videoId -> מתי נבדק
let nfTimer = null, nfRunning = false, nfRerun = false, nfSaveTimer = null;

function nfHidden(v) { return hideBlockedMode && netfreeMode && !!v && nfStatus[v.id] === 'blocked'; }
function nfVisible(list) { return hideBlockedMode && netfreeMode ? list.filter(v => !nfHidden(v)) : list; }

// כל הסרטונים שהסעיף הנוכחי עשוי להציג (לפני הסתרה)
function nfPool() {
  if (section === 'settings' || section === 'channels' || (section === 'all' && !activeChannelFilter)) return allVideos;
  return getSectionVideosRaw();
}
function nfHiddenCount() {
  if (!(hideBlockedMode && netfreeMode)) return 0;
  return nfPool().filter(nfHidden).length;
}
function nfAllHiddenMsg() {
  return nfHiddenCount() > 0 ? 'כל הסרטונים כאן אינם פתוחים בנטפרי ולכן הוסתרו. אפשר לשנות זאת בהגדרות, תחת נטפרי.' : '';
}
function nfCounts() {
  let o = 0, b = 0;
  for (const id in nfStatus) { if (nfStatus[id] === 'open') o++; else if (nfStatus[id] === 'blocked') b++; }
  return { o, b, t: o + b };
}
// בדפים שמציגים כמות מוגבלת (דף הבית, מומלצים) צריך לצייר מחדש כדי שיתמלאו בסרטונים פתוחים
function nfCappedView() { return (section === 'all' && !activeChannelFilter) || section === 'recommended'; }

function loadNfCache() {
  let raw = {};
  try { raw = JSON.parse(localStorage.getItem(NF_CACHE_KEY) || '{}'); } catch (e) {}
  const now = Date.now();
  for (const id in raw) {
    const e = raw[id];
    if (!Array.isArray(e)) continue;
    const ttl = e[0] === 'open' ? NF_OPEN_TTL : NF_BLOCKED_TTL;
    if (now - e[1] < ttl) { nfStatus[id] = e[0]; nfTime[id] = e[1]; }
  }
}
function saveNfCache() {
  clearTimeout(nfSaveTimer);
  nfSaveTimer = setTimeout(() => {
    const out = {};
    const now = Date.now();
    let n = 0;
    for (const id in nfStatus) {
      const t = nfTime[id];
      if (!t || n >= 1500) continue;
      const ttl = nfStatus[id] === 'open' ? NF_OPEN_TTL : NF_BLOCKED_TTL;
      if (now - t < ttl) { out[id] = [nfStatus[id], t]; n++; }
    }
    try { localStorage.setItem(NF_CACHE_KEY, JSON.stringify(out)); } catch (e) {}
  }, 500);
}

// ---- שורת הסבר בראש הפיד ----
function nfNoteText() {
  const n = nfHiddenCount();
  const base = n > 0 ? 'הוסתרו ' + n + ' סרטונים שאינם פתוחים בנטפרי' : 'מוצגים רק סרטונים פתוחים בנטפרי';
  return nfRunning ? base + ' (בודק...)' : base;
}
function nfNoteHtml() {
  if (!(hideBlockedMode && netfreeMode) || !allVideos.length) return '';
  return '<div class="nf-note' + (nfRunning ? ' busy' : '') + '" id="nf-note"><span class="nf-note-dot"></span><span id="nf-note-t">' + nfNoteText() + '</span><a onclick="openSettings(\'netfree\')">שינוי בהגדרות</a></div>';
}
function updateNfNote() {
  const el = document.getElementById('nf-note');
  if (!el) return;
  el.classList.toggle('busy', nfRunning);
  const t = document.getElementById('nf-note-t');
  if (t) t.textContent = nfNoteText();
}

function removeNetfreeDots() {
  document.querySelectorAll('.nf-dot').forEach(el => el.remove());
}

function markNetfreeDots() {
  document.querySelectorAll('[id^="thumb-"]').forEach(w => {
    const open = netfreeMode && nfStatus[w.id.slice(6)] === 'open';
    const dot = w.querySelector('.nf-dot');
    if (open && !dot) w.insertAdjacentHTML('beforeend', NF_DOT_HTML);
    else if (!open && dot) dot.remove();
  });
}

// הסתרה מיידית (ללא ציור מחדש) של כרטיסים שנמצאו חסומים
function applyNfHideDom() {
  const on = hideBlockedMode && netfreeMode;
  document.querySelectorAll('.vcard[data-vid]').forEach(c => {
    c.classList.toggle('nf-hide', on && nfStatus[c.getAttribute('data-vid')] === 'blocked');
  });
}

function refreshAfterNfChange() {
  updateNotifBadge();
  renderChannels();
  renderNotifPanel();
  if (section !== 'settings') renderContent();
}

function setNetfreeMode(on) {
  if (on === netfreeMode) return true;
  if (on) {
    if (!extMode) { toast('מצב נטפרי דורש את התוסף MyTube Bridge'); return false; }
    netfreeMode = true;
    localStorage.setItem(NETFREE_MODE_KEY, '1');
    toast('בודק אילו סרטונים פתוחים בנטפרי...');
    scheduleNetfreeCheck(true);
  } else {
    const wasHiding = hideBlockedMode;
    netfreeMode = false;
    hideBlockedMode = false;
    localStorage.setItem(NETFREE_MODE_KEY, '0');
    localStorage.setItem(NF_HIDE_KEY, '0');
    removeNetfreeDots();
    if (wasHiding) refreshAfterNfChange();
  }
  updateNetfreeToggleUI();
  return true;
}

function toggleNetfreeMode() { setNetfreeMode(!netfreeMode); }

function setHideBlocked(on) {
  if (on && !netfreeMode && !setNetfreeMode(true)) return;
  hideBlockedMode = !!on && netfreeMode;
  localStorage.setItem(NF_HIDE_KEY, hideBlockedMode ? '1' : '0');
  updateNetfreeToggleUI();
  refreshAfterNfChange();
  if (hideBlockedMode) scheduleNetfreeCheck();
}

function recheckNetfree() {
  if (!netfreeMode || !extMode) { toast('מצב נטפרי כבוי'); return; }
  for (const id in nfStatus) delete nfStatus[id];
  for (const id in nfTime) delete nfTime[id];
  try { localStorage.removeItem(NF_CACHE_KEY); } catch (e) {}
  removeNetfreeDots();
  refreshAfterNfChange();
  updateNetfreeToggleUI();
  scheduleNetfreeCheck(true);
  toast('בודק מחדש אילו סרטונים פתוחים...');
}

function scheduleNetfreeCheck(fresh) {
  if (!netfreeMode || !extMode) return;
  clearTimeout(nfTimer);
  nfTimer = setTimeout(() => runNetfreeCheck(!!fresh), 400);
}

// קודם הסרטונים שמוצגים כרגע, ואם ההסתרה פעילה גם המשך הרשימה
function nfCandidateIds() {
  const set = new Set();
  document.querySelectorAll('[id^="thumb-"]').forEach(w => set.add(w.id.slice(6)));
  if (hideBlockedMode) nfPool().slice(0, NF_PREFETCH).forEach(v => { if (v && v.id) set.add(v.id); });
  return [...set].filter(id => nfStatus[id] === undefined);
}

async function runNetfreeCheck(fresh) {
  if (nfRunning) { nfRerun = true; return; }
  nfRunning = true;
  updateNfNote();
  let newlyBlocked = false;
  let turnedOff = false;
  try {
    markNetfreeDots();
    const ids = nfCandidateIds();
    for (let i = 0; i < ids.length && netfreeMode; i += NF_BATCH) {
      const r = await extCall('NF_CHECK', 90000, { ids: ids.slice(i, i + NF_BATCH), fresh: !!fresh && i === 0 });
      if (!r || r.netfree === false) {
        netfreeMode = false;
        hideBlockedMode = false;
        turnedOff = true;
        localStorage.setItem(NETFREE_MODE_KEY, '0');
        localStorage.setItem(NF_HIDE_KEY, '0');
        updateNetfreeToggleUI();
        removeNetfreeDots();
        toast('לא זוהה סינון נטפרי בדפדפן הזה');
        break;
      }
      const now = Date.now();
      for (const id in r.results) {
        const s = r.results[id];
        if (s === 'error') continue;
        if (s === 'blocked' && nfStatus[id] !== 'blocked') newlyBlocked = true;
        nfStatus[id] = s;
        nfTime[id] = now;
      }
      markNetfreeDots();
      applyNfHideDom();
      updateNfNote();
      updateSettingsLive();
    }
  } catch (e) {
    toast('בדיקת נטפרי נכשלה, ודא שהתוסף מעודכן');
  } finally {
    nfRunning = false;
    saveNfCache();
    updateNfNote();
    updateSettingsLive();
    if (turnedOff) {
      // ההסתרה בוטלה, אז מציירים מחדש כדי שהסרטונים החסומים יחזרו
      refreshAfterNfChange();
    } else if (hideBlockedMode && netfreeMode && newlyBlocked) {
      updateNotifBadge();
      renderChannels();
      renderNotifPanel();
      // בדף הבית ובמומלצים ממלאים את החללים בסרטונים פתוחים. לא מציירים מחדש בזמן ניגון בתוך הדף.
      if (nfCappedView() && activeInlineId == null) renderContent();
    }
    if (nfRerun) { nfRerun = false; scheduleNetfreeCheck(); }
  }
}

// כל רינדור מחדש של התוכן מפעיל בדיקה לסרטונים החדשים שמוצגים
const _renderContentBase = renderContent;
renderContent = function () {
  const r = _renderContentBase.apply(this, arguments);
  if (section !== 'settings' && section !== 'channels') {
    const note = nfNoteHtml();
    if (note) document.getElementById('content').insertAdjacentHTML('afterbegin', note);
  }
  scheduleNetfreeCheck();
  return r;
};

/* ============ GOOGLE SIGN-IN (client-side OAuth, no backend) ============ */
// כל משתמש מתחבר עם חשבון הגוגל שלו ישירות מהדפדפן (ללא שרת
// ביניים לצורך ההתחברות). ה-token שמתקבל משמש לקריאה ישירה ל-YouTube Data API v3 עבור
// המנויים והסרטונים *של אותו משתמש בלבד*. שים לב: הדפדפן חייב להיות
// מסוגל לגשת ל-googleapis.com ו-accounts.google.com (בניגוד לגרסה
// הקודמת שהתגברה על חסימת רשת דרך שרת ביניים).
let tokenClient = null;
let accessToken = null;
let tokenExpiresAt = 0; // epoch ms
let gsiReady = false;

function initGoogleAuth() {
  function tryInit() {
    if (!(window.google && google.accounts && google.accounts.oauth2)) {
      setTimeout(tryInit, 200);
      return;
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: YT_SCOPE,
      callback: onTokenResponse
    });
    gsiReady = true;
  }
  tryInit();
}

function restoreSessionAndMaybeLoad() {
  const stored = getStoredToken();
  if (stored && stored.access_token && stored.expires_at > Date.now() + 60000) {
    accessToken = stored.access_token;
    tokenExpiresAt = stored.expires_at;
    renderAuthArea();
    loadEverything(false);
  } else if (!currentUser) {
    lastError = 'not_authenticated';
    renderContent();
  }
}

function getStoredToken() {
  try { return JSON.parse(sessionStorage.getItem(TOKEN_KEY) || 'null'); } catch (e) { return null; }
}
function setStoredToken(tok) {
  sessionStorage.setItem(TOKEN_KEY, JSON.stringify(tok));
}
function clearStoredToken() {
  sessionStorage.removeItem(TOKEN_KEY);
}

function onTokenResponse(resp) {
  if (!resp || resp.error) {
    console.error('OAuth error', resp);
    toast('ההתחברות עם Google נכשלה או בוטלה');
    loading = false;
    setRefreshSpin(false);
    return;
  }
  accessToken = resp.access_token;
  tokenExpiresAt = Date.now() + (Number(resp.expires_in || 3500) * 1000);
  setStoredToken({ access_token: accessToken, expires_at: tokenExpiresAt });
  lastError = null;
  loadEverything(true);
}

function signIn() {
  if (!gsiReady || !tokenClient) {
    toast('טוען את מסך ההתחברות של Google...');
    setTimeout(() => { if (gsiReady) signIn(); }, 400);
    return;
  }
  tokenClient.requestAccessToken({ prompt: accessToken ? '' : 'consent' });
}

function signOut() {
  const tok = accessToken;
  accessToken = null;
  tokenExpiresAt = 0;
  clearStoredToken();
  currentUser = null;
  channels = [];
  allVideos = [];
  lastError = 'not_authenticated';
  localStorage.removeItem(CHANNELS_CACHE_KEY);
  localStorage.removeItem(VIDEOS_CACHE_KEY);
  localStorage.removeItem(ME_CACHE_KEY);
  renderAuthArea();
  renderChannels();
  renderContent();
  updateNotifBadge();
  toggleUserMenu(false);
  toast('התנתקת');
  if (tok && window.google && google.accounts && google.accounts.oauth2) {
    try { google.accounts.oauth2.revoke(tok, () => {}); } catch (e) {}
  }
}

/* ============ DATA LOADING (via Cloudflare Worker relay) ============ */
// הקריאה בפועל ל-YouTube API לא יוצאת מהדפדפן (שעלול להיות חסום),
// אלא מה-Worker, שמקבל את הטוקן האישי בכותרת Authorization ומבצע את הקריאה
// בשם המשתמש. הטעינה מתבצעת באצוות כדי לא לעבור את מגבלת הבקשות של Cloudflare.
async function workerCall(params) {
  const url = WORKER_URL + (WORKER_URL.includes('?') ? '&' : '?') + new URLSearchParams(params);
  const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + accessToken } });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function loadEverything(forceToast) {
  if (extMode) return loadFromExtension(forceToast);
  if (loading) return;
  if (!accessToken) {
    lastError = 'not_authenticated';
    renderContent();
    return;
  }
  if (!WORKER_URL || WORKER_URL.indexOf('PASTE_YOUR') === 0) {
    lastError = 'not_configured';
    renderContent();
    return;
  }
  loading = true;
  lastError = null;
  setRefreshSpin(true);
  try {
    // 1) פרופיל + רשימת מנויים
    const subs = await workerCall({ action: 'subs' });
    currentUser = subs.me || null;
    channels = subs.channels || [];
    const thumbById = {};
    channels.forEach(c => { thumbById[c.id] = c.thumb; });
    renderAuthArea();
    renderChannels();

    // 2) סרטונים, באצוות
    const hadData = allVideos.length > 0;
    const batches = [];
    for (let i = 0; i < channels.length; i += WORKER_BATCH) {
      batches.push(channels.slice(i, i + WORKER_BATCH).map(c => c.id).join(','));
    }
    const fresh = [];
    for (let i = 0; i < batches.length; i += WORKER_PARALLEL) {
      const group = await Promise.all(
        batches.slice(i, i + WORKER_PARALLEL).map(ids => workerCall({ action: 'videos', ids }))
      );
      for (const d of group) {
        for (const v of (d.videos || [])) {
          v.channelThumb = thumbById[v.channelId] || '';
          fresh.push(v);
        }
      }
      // משתמש חדש (בלי cache) רואה תוצאות מיד; מי שיש לו cache מקבל הכול בסוף
      if (!hadData) {
        allVideos = fresh.slice().sort((a, b) => (a.publishedAt < b.publishedAt ? 1 : -1));
        renderContent();
      }
    }
    allVideos = fresh.sort((a, b) => (a.publishedAt < b.publishedAt ? 1 : -1));
    dataUpdatedAt = Date.now();

    localStorage.setItem(CHANNELS_CACHE_KEY, JSON.stringify(channels));
    localStorage.setItem(VIDEOS_CACHE_KEY, JSON.stringify(allVideos.slice(0, 300)));
    localStorage.setItem(ME_CACHE_KEY, JSON.stringify(currentUser));

    renderContent();
    updateNotifBadge();
    renderNotifPanel();
    if (forceToast) toast('הנתונים עודכנו');
  } catch (e) {
    console.error(e);
    const msg = (e && e.message) || 'שגיאה בטעינת הנתונים';
    if (msg.indexOf('AUTH_EXPIRED::') === 0) {
      accessToken = null;
      clearStoredToken();
      const realMsg = msg.slice('AUTH_EXPIRED::'.length) || 'פג תוקף ההתחברות';
      currentUser = null;
      lastError = 'שגיאת אימות מול Google: ' + realMsg;
      toast('שגיאת אימות: ' + realMsg);
    } else {
      lastError = msg;
      toast('שגיאה בטעינת הנתונים');
    }
    renderContent();
  } finally {
    loading = false;
    setRefreshSpin(false);
  }
}

function loadCachedChannels() {
  try { channels = JSON.parse(localStorage.getItem(CHANNELS_CACHE_KEY) || '[]'); } catch(e){ channels = []; }
}
function loadCachedVideos() {
  try { allVideos = JSON.parse(localStorage.getItem(VIDEOS_CACHE_KEY) || '[]'); } catch(e){ allVideos = []; }
}
function loadCachedMe() {
  try { currentUser = JSON.parse(localStorage.getItem(ME_CACHE_KEY) || 'null'); } catch(e){ currentUser = null; }
}

function manualRefresh() {
  loadEverything(true);
}

/* ============ RENDER: SIDEBAR CHANNELS ============ */
// לכל ערוץ: מתי עלה ממנו הסרטון האחרון וכמה סרטונים יש בפיד (בהתאם להסתרת סרטונים חסומים)
function channelStats() {
  const last = {}, count = {};
  nfVisible(allVideos).forEach(v => {
    const t = Date.parse(v.publishedAt) || 0;
    count[v.channelId] = (count[v.channelId] || 0) + 1;
    if (!(v.channelId in last) || t > last[v.channelId]) last[v.channelId] = t;
  });
  return { last, count };
}

function recentChannels(n) {
  const { last } = channelStats();
  return channels
    .filter(c => c.id in last)
    .sort((a, b) => last[b.id] - last[a.id])
    .slice(0, n);
}

function renderChannels() {
  const list = document.getElementById('sb-chs');
  const label = document.getElementById('sb-label');
  label.textContent = 'ערוצים אחרונים';
  if (!channels.length) {
    list.innerHTML = `<div class="sb-empty">${lastError ? 'לא ניתן לטעון ערוצים כרגע.' : 'טוען ערוצים...'}</div>`;
    return;
  }
  const recent = recentChannels(sidebarChannelCount);
  if (!recent.length) {
    list.innerHTML = `<div class="sb-empty">אין עדיין סרטונים חדשים מהערוצים שלך.</div>`;
    return;
  }
  list.innerHTML = recent.map(c => {
    const hasNew = channelHasNew(c.id);
    return `
    <div class="chitem ${activeChannelFilter === c.id ? 'active' : ''}" onclick="filterByChannel('${x(c.id)}')" title="${x(c.title)}">
      <div class="chdot ${hasNew ? 'hn' : ''}">
        ${c.thumb ? `<img src="${x(c.thumb)}">` : x((c.title||'?').slice(0,2))}
        <span class="ndot"></span>
      </div>
      <div class="chname">${x(c.title)}</div>
    </div>`;
  }).join('');
}

function filterByChannel(channelId) {
  activeChannelFilter = activeChannelFilter === channelId ? null : channelId;
  if (activeChannelFilter && !['all','following','shorts'].includes(section)) {
    section = 'all';
    syncSidebarActiveClass();
  }
  renderChannels();
  renderContent();
}

function channelHasNew(channelId) {
  const seenAt = seenMap[channelId];
  const pool = nfVisible(allVideos);
  if (!seenAt) {
    return pool.some(v => v.channelId === channelId);
  }
  return pool.some(v => v.channelId === channelId && new Date(v.publishedAt) > new Date(seenAt));
}

let recognition = null;
let listening = false;

function initVoiceSearch() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('mic-btn');
  if (!SR) {
    if (micBtn) micBtn.style.display = 'none'; // הדפדפן לא תומך בחיפוש קולי
    return;
  }
  recognition = new SR();
  recognition.lang = 'he-IL';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition.onresult = function (e) {
    const transcript = e.results[0][0].transcript;
    const input = document.getElementById('search-input');
    if (input) input.value = transcript;
    runSearch();
  };
  recognition.onend = function () {
    listening = false;
    if (micBtn) micBtn.classList.remove('listening');
  };
  recognition.onerror = function () {
    listening = false;
    if (micBtn) micBtn.classList.remove('listening');
  };
}

function toggleVoiceSearch() {
  if (!recognition) return;
  const micBtn = document.getElementById('mic-btn');
  if (listening) {
    recognition.stop();
    listening = false;
    if (micBtn) micBtn.classList.remove('listening');
    return;
  }
  try {
    recognition.start();
    listening = true;
    if (micBtn) micBtn.classList.add('listening');
  } catch (e) {
    // הזיהוי כבר רץ, או נכשל להתחיל
  }
}

function applyChannelFilter(v) {
  return !activeChannelFilter || v.channelId === activeChannelFilter;
}

function getSectionVideos() { return nfVisible(getSectionVideosRaw()); }

function getSectionVideosRaw() {
  if (section === 'channel') return allVideos.filter(v => v.channelId === activeChannelFilter);
  if (section === 'search') return allVideos.filter(v => matchesSearch(v, searchQuery));
  if (section === 'shorts') return allVideos.filter(v => v.isShort).filter(applyChannelFilter);
  if (section === 'following') return allVideos.filter(applyChannelFilter);
  if (section === 'liked') return likedVideos;
  if (section === 'recommended') return computeRecommended();
  if (section === 'watched') return watchHistory;
  if (section === 'watchlater') return watchLater;
  return allVideos.filter(applyChannelFilter); // 'all' + fallback
}

function computeRecommended() {
  const freq = {};
  watchHistory.forEach(function (h) { freq[h.channelId] = (freq[h.channelId] || 0) + 1; });
  likedVideos.forEach(function (h) { freq[h.channelId] = (freq[h.channelId] || 0) + 1; });
  if (!Object.keys(freq).length) return [];

  const watchedIds = new Set(watchHistory.map(function (h) { return h.id; }));
  const rankedChannels = Object.keys(freq).sort(function (a, b) { return freq[b] - freq[a]; });
  const topSet = new Set(rankedChannels.slice(0, 8));

  return allVideos
    .filter(function (v) { return topSet.has(v.channelId) && !watchedIds.has(v.id); })
    .sort(function (a, b) {
      const fa = freq[a.channelId] || 0, fb = freq[b.channelId] || 0;
      if (fb !== fa) return fb - fa;
      return new Date(b.publishedAt) - new Date(a.publishedAt);
    })
    .slice(0, 60);
}

function findVideoById(id) {
  const pools = [allVideos, likedVideos, watchHistory, watchLater];
  for (let i = 0; i < pools.length; i++) {
    const p = pools[i];
    if (!p) continue;
    const found = p.find(v => v.id === id);
    if (found) return found;
  }
  return null;
}

function homeGreeting() {
  const h = new Date().getHours();
  let g = 'ערב טוב';
  if (h < 5) g = 'לילה טוב';
  else if (h < 12) g = 'בוקר טוב';
  else if (h < 17) g = 'צהריים טובים';
  else if (h < 22) g = 'ערב טוב';
  else g = 'לילה טוב';
  const name = currentUser && currentUser.name ? String(currentUser.name).trim().split(/\s+/)[0] : '';
  return name ? g + ', ' + x(name) : g;
}

function homeTopHtml(list) {
  const fresh = list.filter(isVideoNew);
  const chCount = new Set(fresh.map(v => v.channelId)).size;
  let sub;
  if (!fresh.length) {
    sub = 'הכל מעודכן. ' + list.length + ' סרטונים בפיד שלך.';
  } else {
    const a = fresh.length === 1 ? '<strong>סרטון חדש אחד</strong>' : '<strong>' + fresh.length + ' סרטונים חדשים</strong>';
    const b = chCount === 1 ? 'מערוץ אחד' : 'מ-' + chCount + ' ערוצים';
    sub = a + ' ' + b + ' מאז הביקור האחרון.';
  }
  return `
  <div class="home-top">
    <div>
      <div class="home-greet">${homeGreeting()}</div>
      <div class="home-sub">${sub}</div>
    </div>
    <button class="refresh-btn${refreshSpinning ? ' spin' : ''}" id="refresh-btn" onclick="manualRefresh()">${ICON_REFRESH_SM}רענן</button>

}

function homeChipsHtml() {

function renderHomeSections(ct) {
  if (!allVideos.length) {
    ct.innerHTML = homeEmptyHtml(EMPTY_MESSAGES.following);
    return;
  }

  const large = inlineMode;
  const usedIds = new Set();
  const watchedIds = new Set(watchHistory.map(h => h.id));
  const byDate = nfVisible(allVideos);

  if (!byDate.length) {
    ct.innerHTML = homeEmptyHtml(nfAllHiddenMsg() || EMPTY_MESSAGES.following);
    return;
  }

  // כרטיס הפתיחה: הסרטון האחרון שעלה (לא שורט)
  const spot = byDate.find(v => !v.isShort) || byDate[0];
  if (spot) usedIds.add(spot.id);

  const sections = [];

  const featured = byDate.filter(v => !usedIds.has(v.id) && !v.isShort).slice(0, HOME_FEATURED_COUNT);
  featured.forEach(v => usedIds.add(v.id));
  if (featured.length) sections.push({ id: 'shelf-featured', title: 'הכי חדשים', vids: featured, cls: 'vgrid' });

  const unwatched = byDate
    .filter(v => !usedIds.has(v.id) && !watchedIds.has(v.id) && !v.isShort)
    .slice(0, HOME_UNWATCHED_COUNT);
  unwatched.forEach(v => usedIds.add(v.id));
  if (unwatched.length) sections.push({ id: 'shelf-unwatched', title: 'לא נצפו', vids: unwatched, cls: 'vgrid' });

  const shorts = byDate.filter(v => v.isShort && !usedIds.has(v.id)).slice(0, HOME_SHORTS_COUNT);
  shorts.forEach(v => usedIds.add(v.id));
  if (shorts.length) sections.push({ id: 'shelf-shorts', title: 'שורטס', vids: shorts, cls: 'vgrid shorts-grid' });

  const rest = byDate.filter(v => !usedIds.has(v.id)).slice(0, HOME_REST_COUNT);
  if (rest.length) sections.push({ id: null, title: 'מהערוצים שלך', vids: rest, cls: 'vgrid' + (large ? ' vgrid-large' : '') });

  const sectionsHtml = sections.map(sec => {
    const grid = `<div class="${sec.cls}${sec.id ? ' shelf-scroll' : ''}"${sec.id ? ` id="${sec.id}"` : ''}>${sec.vids.map(v => videoCardHtml(v)).join('')}</div>`;
    const nav = sec.id
      ? `<div class="home-head-nav">
           <button class="shelf-nav" onclick="scrollShelf('${sec.id}',-1)" aria-label="הקודם" title="הקודם">${ICON_CHEV_R}</button>
           <button class="shelf-nav" onclick="scrollShelf('${sec.id}',1)" aria-label="הבא" title="הבא">${ICON_CHEV_L}</button>
         </div>`
      : '';
    return `
    <section class="home-section">
      <div class="home-head">
        <h2 class="home-section-title">${x(sec.title)}</h2>
        <span class="home-count">${sec.vids.length}</span>
        ${nav}
      </div>
      ${grid}
    </section>`;
  }).join('');

  ct.innerHTML = homeTopHtml(byDate) + (spot ? homeSpotlightHtml(spot) : '') + homeChipsHtml() + sectionsHtml;
  requestAnimationFrame(updateShelfNavs);
}

// חצי הגלילה מוצגים רק כשיש באמת לאן לגלול
function updateShelfNavs() {
  document.querySelectorAll('.home-section').forEach(sec => {
    const nav = sec.querySelector('.home-head-nav');
    if (!nav) return;
    const shelf = sec.querySelector('.shelf-scroll');
    const scrollable = shelf && (shelf.scrollWidth - shelf.clientWidth > 8);
    nav.style.display = scrollable ? '' : 'none';
  });
}
window.addEventListener('resize', updateShelfNavs);

function scrollShelf(id, dir) {
  const el = document.getElementById(id);
  if (!el) return;
  const amount = Math.max(el.clientWidth * 0.8, 240);
  const rtl = getComputedStyle(el).direction === 'rtl';
  el.scrollBy({ left: (rtl ? -1 : 1) * dir * amount, behavior: 'smooth' });
}

}

function fmtDuration(s) {
  s = Math.round(s||0);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if (h) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `${m}:${String(sec).padStart(2,'0')}`;
}

function timeAgo(iso) {
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime()) / 1000;
  let val = diff, names = ['שניות','דקות','שעות','ימים','חודשים','שנים'];
  const table = [60,60,24,30,12];
  let idx = 0;
  for (; idx < table.length; idx++) {
    if (val < table[idx]) break;
    val /= table[idx];
  }
  val = Math.max(1, Math.floor(val));
  return `לפני ${val} ${names[idx]}`;
}

/* ============ LIKED (local) ============ */
function isLiked(id) {
  return likedVideos.some(v => v.id === id);
}

function toggleLiked(id) {
  const idx = likedVideos.findIndex(v => v.id === id);
  if (idx >= 0) {
    likedVideos.splice(idx, 1);
    toast('הוסר מ"אהבתי"');
  } else {
    const v = findVideoById(id);
    if (!v) return;
    const copy = {}; for (const k in v) copy[k] = v[k];
    copy.likedAt = new Date().toISOString();
    likedVideos.unshift(copy);
    toast('נוסף ל"אהבתי"');
  }
  localStorage.setItem(LIKED_KEY, JSON.stringify(likedVideos.slice(0,300)));
  if (section === 'liked' || section === 'recommended') renderContent();
  else updateLikeButtons();
}

function updateLikeButtons() {
  document.querySelectorAll('.like-btn').forEach(btn => {
    const id = btn.getAttribute('data-vid');
    btn.classList.toggle('on', isLiked(id));
  });
}

function clearLiked() {
  likedVideos = [];
  localStorage.removeItem(LIKED_KEY);
  if (section === 'liked' || section === 'recommended') renderContent();
  updateLikeButtons();
  toast('רשימת "אהבתי" נוקתה');
}

/* ============ WATCH LATER (local) ============ */
function isInWatchLater(id) {
  return watchLater.some(v => v.id === id);
}

  if (idx >= 0) {

    copy.addedAt = new Date().toISOString();
    watchLater.unshift(copy);

/* ============ WATCH HISTORY (local) ============ */
function recordWatch(v) {
  if (!v) return;
  watchHistory = watchHistory.filter(h => h.id !== v.id);
  const copy = {}; for (const k in v) copy[k] = v[k];
  copy.watchedAt = new Date().toISOString();
  watchHistory.unshift(copy);
  watchHistory = watchHistory.slice(0, 200);
  localStorage.setItem(WATCH_HISTORY_KEY, JSON.stringify(watchHistory));
  if (section === 'watched') renderContent();
}

function clearWatchHistory() {
  watchHistory = [];
  localStorage.removeItem(WATCH_HISTORY_KEY);
  if (section === 'watched') renderContent();
  toast('היסטוריית הצפייה נוקתה');
}

/* ============ NOTIFICATIONS ============ */
function updateNotifBadge() {
  const count = getNewVideos().length;
  const b = document.getElementById('notif-badge');
  b.textContent = count > 9 ? '9+' : String(count);
  b.classList.toggle('show', count > 0);
}

function getNewVideos() {
  return nfVisible(allVideos).filter(isVideoNew).slice(0, 30);
}

function renderNotifPanel() {
  const list = document.getElementById('notif-list');
  const items = getNewVideos();
  if (!items.length) {
    list.innerHTML = `<div class="np-empty">אין התראות חדשות כרגע.</div>`;
    return;
  }
  list.innerHTML = items.map(v => `
    <div class="np-item" onclick="openFromNotif('${x(v.id)}', '${x(v.channelId)}')">
      <img class="np-thumb" src="${x(v.thumb||'')}" loading="lazy">
      <div>
        <div class="np-title">${x(v.title)}</div>
        <div class="np-ch">${x(v.channelTitle)} · ${timeAgo(v.publishedAt)}</div>
      </div>
    </div>`).join('');
}

function openFromNotif(id, channelId) {
  markChannelSeen(channelId);
  toggleNotifPanel(false);
  openPlayer(id);
}

function markChannelSeen(channelId) {
  seenMap[channelId] = new Date().toISOString();
  localStorage.setItem(SEEN_KEY, JSON.stringify(seenMap));
  updateNotifBadge();
  renderChannels();
}

function markAllSeen() {
  const now = new Date().toISOString();
  channels.forEach(c => { seenMap[c.id] = now; });
  allVideos.forEach(v => { if (!seenMap[v.channelId]) seenMap[v.channelId] = now; });
  localStorage.setItem(SEEN_KEY, JSON.stringify(seenMap));
  updateNotifBadge();
  renderChannels();
  renderNotifPanel();
  renderContent();
  toast('כל ההתראות סומנו כנקראו');
}

function toggleNotifPanel(force) {
  const p = document.getElementById('notif-panel');
  const open = typeof force === 'boolean' ? force : !p.classList.contains('open');
  p.classList.toggle('open', open);
  if (open) renderNotifPanel();
}

/* ============ PLAYER MODAL ============ */
function openPlayer(id) {
  const v = findVideoById(id);
  recordWatch(v);
  const isShort = v && v.isShort;
  const wrap = document.getElementById('pm-frame-wrap');
  wrap.className = 'pm-frame-wrap' + (isShort ? ' short-mode' : '');
  document.getElementById('pm-iframe-host').innerHTML =
    `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  document.getElementById('pm-title').textContent = (v && v.title) || '';
  document.getElementById('pm-ch').textContent = (v && v.channelTitle) || '';
  document.getElementById('player-modal').classList.add('open');
}
function closePlayer() {
  document.getElementById('player-modal').classList.remove('open');
  document.getElementById('pm-iframe-host').innerHTML = '';
}

/* ============ INLINE (IN-PAGE) PLAYBACK ============ */
function toggleInlineMode() {
  inlineMode = !inlineMode;
  localStorage.setItem(INLINE_MODE_KEY, inlineMode ? '1' : '0');
  updateInlineToggleUI();
  activeInlineId = null;
  if (section !== 'settings') renderContent();
}

function updateInlineToggleUI() { updateSettingsLive(); }

function toggleInlinePlay(id) {
  if (activeInlineId === id) {
    closeInlinePlay(id);
    activeInlineId = null;
    return;
  }
  if (activeInlineId) closeInlinePlay(activeInlineId);
  activeInlineId = id;
  const v = findVideoById(id);
  recordWatch(v);
  const wrap = document.getElementById('thumb-' + id);
  if (!wrap) return;
  wrap.innerHTML = `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:none;"></iframe>`;
}

function closeInlinePlay(id) {
  const v = findVideoById(id);
  const wrap = document.getElementById('thumb-' + id);
  if (!wrap || !v) return;
  wrap.innerHTML = thumbInnerHtml(v);
}

  if (tab) settingsTab = tab;

function toggleSettings(force) {

    const on = t.dataset.tab === id;
    t.classList.toggle('on', on);
    t.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.querySelectorAll('.sp-panel').forEach(p => p.classList.toggle('on', p.dataset.panel === id));
}

/* ---- עדכון מצב הרכיבים בלי לצייר את הדף מחדש ---- */
function spText(id, t) { const e = document.getElementById(id); if (e) e.textContent = t; }
function spSw(id, on, disabled) {
  const e = document.getElementById(id);
  if (!e) return;
  e.setAttribute('aria-checked', on ? 'true' : 'false');
  e.disabled = !!disabled;
}
function spPill(id, ok, text) {
  const e = document.getElementById(id);
  if (!e) return;
  e.className = 'sp-pill ' + (ok ? 'ok' : 'bad');
  if (e.lastElementChild) e.lastElementChild.textContent = text;
}
function spCounts() {
  return { seen: Object.keys(seenMap).length, history: watchHistory.length, liked: likedVideos.length, later: watchLater.length };
}

function updateSettingsLive() {
  if (!document.getElementById('sp-root')) return;
  const dark = document.body.classList.contains('dark');
  document.querySelectorAll('#sp-theme button').forEach(b => b.classList.toggle('on', (b.dataset.theme === 'dark') === dark));
  spSw('sw-sidebar', document.getElementById('sidebar').classList.contains('col'), false);
  document.querySelectorAll('#sp-sbn button').forEach(b => b.classList.toggle('on', Number(b.dataset.n) === sidebarChannelCount));
  spSw('sw-inline', inlineMode, false);
  spSw('sw-netfree', netfreeMode, !extMode);
  spSw('sw-nfhide', hideBlockedMode && netfreeMode, !extMode);

  spPill('sp-ext-pill', extMode, extMode ? 'מותקן' : 'לא זוהה');
  spText('sp-ext-desc', extMode
    ? 'הבדיקה מתבצעת דרך התוסף, ישירות בדפדפן שלך' + (extVersion ? ' (גרסה ' + extVersion + ')' : '') + '.'
    : 'מצב נטפרי דורש את התוסף. יש להתקין אותו ולרענן את הדף.');
  const rb = document.getElementById('sp-recheck');
  if (rb) rb.disabled = !(netfreeMode && extMode);
  const c = nfCounts();
  spText('sp-nf-total', netfreeMode ? c.t : '-');
  spText('sp-nf-open', netfreeMode ? c.o : '-');
  spText('sp-nf-blocked', netfreeMode ? c.b : '-');

  const signed = extMode || !!currentUser;
  spPill('sp-conn', signed, extMode ? 'מחובר דרך התוסף' : (currentUser ? 'מחובר עם Google' : 'לא מחובר'));
  spText('sp-conn-desc', channels.length + ' ערוצים · ' + allVideos.length + ' סרטונים');
  spText('sp-updated', dataUpdatedAt ? 'עודכן ' + timeAgo(dataUpdatedAt) : 'עדיין לא עודכן');

  const n = spCounts();
  const units = { seen: 'ערוצים מסומנים', history: 'סרטונים', liked: 'סרטונים', later: 'סרטונים' };
  for (const k in units) {
    spText('sp-c-' + k, n[k] + ' ' + units[k]);
    const b = document.getElementById('sp-b-' + k);
    if (b) b.disabled = !n[k];
  }
}

function updateNetfreeToggleUI() { updateSettingsLive(); }

/* ---- פעולות ---- */
function setTheme(t) {
  document.body.className = t === 'light' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, document.body.className);
  updateSettingsLive();
}

function setSidebarCol(on) {
  document.getElementById('sidebar').classList.toggle('col', !!on);
  document.getElementById('main').classList.toggle('col', !!on);
  localStorage.setItem(SIDEBAR_KEY, on ? '1' : '0');
  updateSettingsLive();
}
function setSidebarChannelCount(n) {
  sidebarChannelCount = [5, 8, 12].includes(n) ? n : 8;
  localStorage.setItem(SB_CH_KEY, String(sidebarChannelCount));
  renderChannels();
  updateSettingsLive();
}
function toggleSidebarCol() {
  setSidebarCol(!document.getElementById('sidebar').classList.contains('col'));
}

// לחיצה ראשונה מבקשת אישור, לחיצה שנייה (תוך כמה שניות) מבצעת
function spDisarm(btn) {
  clearTimeout(btn._t);
  btn.dataset.armed = '';
  btn.classList.remove('armed');
  btn.textContent = btn.dataset.label;
}
function spArm(btn, fn) {
  if (btn.dataset.armed !== '1') {
    btn.dataset.armed = '1';
    btn.classList.add('armed');
    btn.textContent = 'לחץ שוב לאישור';
    clearTimeout(btn._t);
    btn._t = setTimeout(() => spDisarm(btn), 3500);
    return;
  }
  spDisarm(btn);
  fn();
}
function spClear(btn, kind) {
  const fns = { seen: clearSeenMarks, history: clearWatchHistory, liked: clearLiked, later: clearWatchLater };
  spArm(btn, () => { fns[kind](); updateSettingsLive(); });
}
function spReset(btn) { spArm(btn, resetSettings); }

function resetSettings() {
  setTheme('light');
  setSidebarCol(false);
  setSidebarChannelCount(8);
  if (inlineMode) toggleInlineMode();
  hideBlockedMode = false;
  localStorage.setItem(NF_HIDE_KEY, '0');
  setNetfreeMode(false);
  updateSettingsLive();
  toast('ההגדרות אופסו');
}

/* ============ UI BINDINGS ============ */
function bindUI() {
  document.getElementById('sidebar-toggle').onclick = () => {
    const sb = document.getElementById('sidebar');
    if (window.innerWidth <= 760) {
      sb.classList.toggle('mobopen');
      return;
    }
    const col = sb.classList.toggle('col');
    document.getElementById('main').classList.toggle('col', col);
    localStorage.setItem(SIDEBAR_KEY, col ? '1' : '0');
    updateSettingsLive();
  };

  document.getElementById('theme-toggle').onclick = () => {
    const isDark = document.body.classList.contains('dark');
    document.body.className = isDark ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, document.body.className);
    updateSettingsLive();
  };

  document.getElementById('bell-btn').onclick = (e) => {
    e.stopPropagation();
    toggleNotifPanel();
    toggleUserMenu(false);
  };

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#notif-panel') && !e.target.closest('#bell-btn')) toggleNotifPanel(false);
    if (!e.target.closest('#user-menu') && !e.target.closest('#auth-area')) toggleUserMenu(false);
    if (!e.target.closest('#sidebar') && !e.target.closest('#sidebar-toggle') && window.innerWidth <= 760) {
      document.getElementById('sidebar').classList.remove('mobopen');
    }
  });

  document.getElementById('player-modal').addEventListener('click', (e) => {
    if (e.target.id === 'player-modal') closePlayer();
  });

  setInterval(() => {
    loadEverything(false);
  }, 5 * 60 * 1000);
}

let refreshSpinning = false;
function setRefreshSpin(on) {
  refreshSpinning = !!on;
  const b = document.getElementById('refresh-btn');
  if (b) b.classList.toggle('spin', refreshSpinning);
}

/* ============ HELPERS ============ */
function x(s='') { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
let _t;
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(_t); _t = setTimeout(()=>t.classList.remove('show'), 2600); }
</script>
